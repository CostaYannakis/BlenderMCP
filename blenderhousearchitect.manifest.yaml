  materials: [MAT_EXT_BRICK_DARK_BASE_XZ, MAT_EXT_BRICK_DARK_BASE_YZ]
  band_top_z_m: 0.0
  band_bottom_z_m: -2.300
  construction: >-
    Browner base-course brick with a LEVEL top at floor level, running down past the
