      tread_depth_m: 0.28
      ceiling_datum_m: 2.40
      status: provisional_plan_and_standard_step_assumption
  external_wall:
    construction_assumption: brick_veneer_on_timber_frame
    total_thickness_m: 0.25
    components_m:
      brick_veneer: 0.11
      drained_cavity: 0.04
      timber_frame: 0.09
      internal_lining: 0.01
    status: editable_modeling_assumption
  internal_wall:
    construction_assumption: lined_timber_stud_partition
    total_thickness_m: 0.11
    components_m:
      timber_frame: 0.09
      lining_each_side: 0.01
    status: editable_modeling_assumption
  windows:
    boolean_solver: exact
    cutter_clearance_through_host_m: 0.10
    habitable_room:
      sill_height_m: 0.90
      head_height_m: 2.10
    service_room:
      sill_height_m: 1.20
      head_height_m: 2.10
    wet_room:
      sill_height_m: 1.50
      head_height_m: 2.10
    status: provisional_modeling_assumptions
  doors:
    boolean_solver: exact
    cutter_clearance_through_host_m: 0.10
    sill_height_m: 0.0
    head_height_m: 2.04
    status: provisional_plan_trace_and_standard_head_assumption
  geometric_tolerance_m: 0.001
  working_grid_m: 0.01

wall_workflow:
  collection: ARCH_Walls
  object_policy: one_wall_section_per_object
  join_wall_sections: false
  naming_pattern: WALL_<LEVEL>_<ORIENTATION_OR_ZONE>_<NNN>
  first_sequence:
    - external_wall_sections
    - internal_wall_sections
    - verify_dimensions_and_adjacencies
  defer_until_wall_pass_verified:
    - floors
    - ceilings
    - roofs
    - doors
    - fixtures
    - furnishings
  corrections:
    - id: WALL_FIX_KITCHEN_LOUNGE_001
      object: WALL_GROUND_INT_KITCHEN_LOUNGE_022
      plan_start_px: [159, 263]
      plan_end_px: [244, 263]
      thickness_m: 0.11
      height_m: 2.4
      status: provisional_plan_trace
    - id: WALL_FIX_FAMILY_KITCHEN_002
      object: WALL_GROUND_INT_FAMILY_KITCHEN_023
      plan_start_px: [130, 178]
      plan_end_px: [234, 178]
      thickness_m: 0.11
      bottom_z_m: -0.34
      top_z_m: 2.40
      status: provisional_plan_trace

opening_workflow:
  cutter_collection: ARCH_Opening_Cutters
  window_collection: ARCH_Windows
  door_collection: ARCH_Doors
  host_wall_policy: retain_one_object_per_wall_section
  cutter_host_link: custom_property_host_wall
  parent_cutter_to_host: false
  boolean_operation: difference
  boolean_solver: exact
  prefer_live_boolean_modifiers: true
  implementation_mode: recoverable_baked_working_walls
  working_wall_modifiers_applied: true
  recovery_base_collection: ARCH_Wall_Bases
  recovery_base_naming_pattern: BASE_<HOST_WALL_NAME>
  cutter_normals: outward
  cutter_naming_pattern: CUT_<TYPE>_<ID>
  modifier_naming_pattern: BOOL_<TYPE>_<ID>
  cutter_display: wire
  cutter_render_visibility_after_bake: hidden
  verification: ray_through_opening_center

