schema_version: 2
status: active_modeling_seed
last_reviewed: 2026-08-08

project:
  name: balmoral_house
  building_class_assumption: class_1a_detached_dwelling
  jurisdiction: null
  notes:
    - Confirm the Australian state or territory before treating any regulatory value as applicable.
    - This manifest contains modeling defaults, not engineering, certification, or compliance approval.

units:
  system: metric
  length: metres
  angle: degrees
  blender_scale_length: 1.0

regulatory_context:
  national_baseline: NCC_2022_Amendment_2
  adoption_note: NCC_2025 adoption must be checked for the selected jurisdiction.
  ncc_room_height_minimums_m:
    habitable_room_excluding_kitchen: 2.4
    kitchen: 2.1
    corridor_or_passage: 2.1
    bathroom_laundry_or_similar: 2.1
    stairway_ramp_or_landing: 2.0
  masonry_veneer_cavity_range_m:
    minimum: 0.025
    maximum: 0.075
  references:
    - title: NCC editions and current status
      url: https://ncc.abcb.gov.au/editions-national-construction-code
    - title: NCC Part 10.3 Room heights
      url: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/housing-provisions/10-health-and-amenity/part-103-room-heights
    - title: NCC Part 5.7 Weatherproofing of masonry
      url: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/housing-provisions/5-masonry/part-57-weatherproofing-masonry

