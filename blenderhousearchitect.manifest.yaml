    the reference photo. Resolves the previously floating slab.
  dark_brick_tone_correction:
    reason: >-
      Same defect as the red brick - Color1 was near-black (sRGB 33,20,14) against a
      dark red-brown Color2, giving a patchwork.
    color1_srgb: [88, 58, 46]
    color2_srgb: [110, 76, 60]
    mortar_srgb: [126, 118, 106]
    soiling_multiplier_range: [0.86, 1.06]
  caveat: >-
    An orthographic elevation render is edge-on to the ground plane and therefore
    shows the buried part of the band. Judge band height from perspective views only.

exterior_hardscape:
  collection: ARCH_Exterior_Hardscape
  status: provisional_from_user_description_and_exterior_photo
  entry_walkway:
    object: PAVING_GROUND_ENTRY_WALKWAY_001
    material: MAT_EXT_CONCRETE_PAVING
    top_z_m: -0.050
    thickness_m: 0.100
    outline_m:
      - [2.290, -3.688]   # re-entrant corner, entry east face meets lounge south face
      - [4.928, -3.688]   # the lounge corner - slab NE corner sits exactly on it
      - [4.928, -8.806]
      - [2.881, -8.806]   # end of the front bedroom (bed 4 south face)
      - [2.881, -5.288]
      - [2.290, -5.288]
    width_at_entry_m: 2.638
    width_at_bed4_m: 2.047
    length_m: 5.118
    derivation: >-
      User: "outside the entry, there is a concrete walkway that lines up with the
      lounge corner all the way to the end of the front bedroom." East edge set on
      the lounge east wall face; north end on the lounge south wall face; south end
      on bedroom 4's south wall face; west edge follows the stepped house footprint.
    open_question: >-
      2.638 m is wide for a walkway - the whole recess is filled. The alternative
      reading is a narrower path with only its east edge on the lounge-corner line.
  entry_steps:
    objects: [STEP_GROUND_ENTRY_001, STEP_GROUND_ENTRY_002, STEP_GROUND_ENTRY_003]
    material: MAT_EXT_CONCRETE_PAVING
    riser_count: 5
    riser_height_m: 0.170
    bottom_riser_height_m: 0.340
    bottom_riser_note: >-
      Deliberately double the others, on the user's instruction. The site datum was
      dropped 0.170 to suit, which is what exposes the extra brown base course.
    going_m: 0.360
    width_m: 2.047
    horizontal_run_m: 1.440
    two_R_plus_G_mm: 700
    handrail_detail: >-
      Rails follow the nosing line of the four equal risers and stop at the last
      nosing (Z = -0.730); a taller newel then carries down to the ground at -1.070.
      Over the doubled bottom riser the rail therefore sits ~1.22 m above the
      ground rather than 0.900.
    comfort_note: >-
      Going deepened from 0.300 to 0.360 at the user's request for more foot room.
      2R+G = 700 mm, at the upper end of the comfortable range, so the going should
      not go deeper without dropping the riser height.
    location: south end of the walkway, descending south from Y = -8.806
    extent_y_m: [-10.246, -8.806]
    total_fall_m: 0.850
    implied_ground_z_m: -0.900
    implied_ground_note: >-
      The ground level at the foot of the flight is DERIVED from "5 steps" x a
      standard 0.170 riser. It is not surveyed. If the real fall differs, the riser
      count or height needs revisiting.
    tread_faces: 4 intermediate treads plus the landing
    width_history: >-
      Briefly flared to 2.547 m on a misreading of "wider"; reverted. The flight is
