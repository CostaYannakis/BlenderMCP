        type: raking stair rail, east cheek
      - object: BALUSTRADE_ENTRY_STEP_W_001
        type: raking stair rail, west cheek
      - object: BALUSTRADE_ENTRY_EAST_001
        type: level run along the walkway's open east edge
        assumption: >-
          Assumes the walkway's east side is also elevated above grade. If the
          walkway sits at grade and only the south end drops away, delete this
          object - it is deliberately separate for that reason.
    simplification: >-
      Plain picket balustrade. The reference photo has decorative scrollwork at the
      stair newels which is not modelled.
  not_yet_modelled:
    - >-
      Edge beam / brick base under the walkway. With the ground at -0.730 the
      100 mm slab visibly floats 0.58 m clear. The exterior photo shows a brick
      base wall under the front verandah.
    - surrounding site levels, garden beds, driveway paving

