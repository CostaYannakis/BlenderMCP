      - {windows: [W08, W09], corner_m: [2.881, -8.806], room: bedroom_4}
      - {windows: [W05, W14], corner_m: [5.873, 0.170], room: meals}
    detail: >-
      Each cutter overshoots past the wall end so the boolean removes the corner
      brickwork entirely. The two jambs that would meet at the corner are omitted
      and replaced by a single 90 mm mullion post (WINDOW_CORNER_POST_*).
    superseded: the 0.50 m minimum pier below now applies only to non-corner ends
  minimum_corner_pier_m: 0.50
  repositioned:
    W05: {was: [0.335, 2.146], now: [0.670, 2.481], was_gap: 0.164}
    W06: {was: [-3.524, -1.358], now: [-3.188, -1.022], was_gap: 0.164}
    W07: {was: [2.913, 4.764], now: [2.577, 4.428], was_gap: 0.164}
    W08: {was: [-8.642, -6.909], now: [-8.306, -6.573], was_gap: 0.164}
