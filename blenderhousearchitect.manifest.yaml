    privacy sills.
  corner_windows:
    correction: >-
      My first pass added a 0.50 m brick pier at every corner. That was wrong - the
      user confirmed the glass WRAPS these corners with no brick between the two
      windows. The original trace put all three pairs 0.164 m off their corners,
      which is consistent with them always having been corner windows.
    pairs:
