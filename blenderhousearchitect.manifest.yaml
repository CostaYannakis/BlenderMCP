  defect_found_and_fixed: >-
    First veneer rebuild placed the panels near the world origin - the wall objects
    have non-identity transforms and the mesh was read in local space without
    applying matrix_world. Walls rendered showing the orange blockout material.
    Fixed by baking the world transform into the bmesh before offsetting.

