  material: MAT_SITE_GROUND
  status: derived_not_surveyed
  slope:
    direction: falls from the front (south) toward the back (north)
    grade: 1:27.8 (3.6 percent)
    formula_z_m: -1.070 - (Y + 10.246) * 0.036
    datum: bottom of the entry flight, Y = -10.246, Z = -1.070
    levels_m:
      foot_of_steps_Y_-10.246: -1.070
      top_of_steps_Y_-8.806: -1.122
      lounge_corner_Y_-3.688: -1.306
      mid_house_Y_0: -1.439
      kitchen_north_wall_Y_3.232: -1.555
      rear_wall_Y_8.216: -1.735
  derivation: >-
    User: "the block slopes from the front of the house back." Grade chosen so the
    rear deck at -0.340 clears the ground by ~1.4 m, matching the site plan's
    "Cubby House Under Deck" note. Datum then dropped 0.170 when the bottom riser
    was doubled, on the user's instruction to start the slope lower and show more
    of the brown base course.
  open_questions:
    - actual surveyed fall front to back
    - whether the block crests near the house rather than falling uniformly
    - no lawn / driveway / garden-bed differentiation; one graded plane only

