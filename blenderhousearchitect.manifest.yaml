      walls_moved: [WALL_GROUND_EXT_SOUTH_SPA_015 (+ its window W15),
                    WALL_GROUND_EXT_WEST_SPA_016 (stretched),
                    WALL_GROUND_EXT_WEST_BEDS_014 (shortened)]
      alcove_length_m: {was: 1.325, now: 1.615}
      bath_length_m: {was: 1.195, now: 1.485}
      note: >-
