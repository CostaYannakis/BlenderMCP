      house has only two - one on the corner and one near the entry door. The 19
      invented fittings were deleted.
    lights:
      - {id: DUSK_LIGHT_ENTRY, at_m: [2.44, -3.94, 2.00],
         note: beside the front door on the entry wall (D10 spans Y -4.902 to -4.075)}
      - {id: DUSK_LIGHT_CORNER, at_m: [3.02, -5.52, 2.00],
         note: on the external corner where the footprint steps out to bedroom 4}
    fittings: DUSK_FITTING_ENTRY, DUSK_FITTING_CORNER (emissive boxes)
    unresolved: >-
      "the corner" was interpreted as the bedroom-4 step corner because it is the
      nearest external corner to the entry. Confirm which corner is meant.
  sky_grade:
    hdri: qwantani_dusk_1_puresky (chosen over dusk_2 - measured blue/red ratio
          1.68 vs 1.42 over the upper hemisphere)
    world_strength: 0.30
    tint_multiply: [0.62, 0.80, 1.35]
    rotation: afterglow placed behind the camera so the view faces the deep blue sky
    exposure: -0.05
