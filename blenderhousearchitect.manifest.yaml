        The roof was rebuilt with the updated rectangle so it still covers it.
      alignment: alcove south face at Y -1.720, level with the basin front
    vanity_narrowed:
      depth_m: {was: 0.590, now: 0.520}
      basin_width_m: {was: 0.470, now: 0.410}
      reason: free up floor area
    door_D06_moved:
      was_wall: WALL_GROUND_INT_BATH_NORTH_010, x [-3.228, -2.402], width 0.826
      now_wall: WALL_GROUND_INT_BATH_BED2_HALL_014 (east), y [-1.700, -1.070], width 0.630
      reason: >-
        User: the door belongs on the wall opposite the spa. Moved to the east
        wall, directly facing the alcove. Both walls rebuilt from their BASE_
        copies - the north wall is now solid (6 faces), the east wall carries D06
        plus D07 (14 faces).
      width_source: >-
        0.630 measured directly off the plan at 34x zoom. The manifest's original
        trace had 0.826, which was 0.196 too wide.
    toilet_rebuilt_v2:
      method: lofted from 7 elliptical profiles, 28 segments
      form: tapered pedestal flaring to an oval bowl, closed seat/lid, cistern with
            lid and flush button
      position_x: -3.600 (mid north wall, so it reads in the right foreground)
      asset_search: >-
        Looked for a CC0 toilet model first. Poly Haven's 521-model library has
        none, and ambientCG's 3D models are surfaces and decor only. Modelled it
        instead. BlenderKit's free tier is the most likely source if a real
        sanitaryware asset is wanted later.
    stale_window_frame_bug: >-
      Extending the alcove moved WALL_GROUND_EXT_SOUTH_SPA_015 and CUT_WINDOW_W15
      by 290 mm, but the WINDOW_W15_* frame and glazing were not regenerated, so
      they stayed at the old position - floating 290 mm proud of the wall, inside
      the room. Lesson: the frame/glazing generator derives from the cutters and
      MUST be re-run after any wall or opening move. All 14 windows regenerated.
    toilet_base_to_wall: >-
      The lofted pan stopped at Y -0.174 while the wall is at Y 0.004, leaving the
      cistern floating over a 178 mm gap. Added BATH_WC_PEDESTAL_REAR_001, a
      rounded pedestal carrying the base back to the wall for the cistern to sit on.
    window_light_bug: >-
      Both alcove daylight sources were rotated to emit AWAY from the room - W15
      (south of the room) pointed south and W16 (north) pointed north. The alcove
      was lit only by the ceiling fill. Rotations swapped; area lights emit along
      local -Z, so Rx(+90) gives +Y and Rx(-90) gives -Y.
    toilet_rebuilt: >-
      Was a plain rounded box plus a floating cistern. Now a shaped close-coupled
      suite - narrower pedestal, wider bowl, seat, cistern with lid and flush button.
    camera_moved: >-
      The reference photo is shot from the doorway, which is why no opening appears
      in it. The camera now sits just inside D06 so the door is behind it, giving
      the reference composition: vanity left, bath alcove ahead, toilet right.
      The doorway was never a modelling error - it is on the plan.
  defects_found_and_fixed:
    - >-
      SET_CEILING_GROUND sat at Z 2.400, exactly coplanar with the roof soffit, and
      rendered as solid black. Ceiling dropped to 2.370-2.398. Same root cause as
      the earlier base-course artifact.
    - >-
      WALL_GROUND_EXT_WEST_SPA_016 has inverted mesh normals, so the normal-based
      exterior/interior material test put the blockout material on its INTERIOR
      face - visible as an orange band above the alcove tiling. Wall face
      classification is now done by face POSITION relative to the exterior plane,
      which is normal-independent. Re-running it also corrected EAST_ENS_002,
      STEP_BED4_009 and STEP_SOUTH_012.

downloaded_assets:
  root: C:\Workspace\Blender\assets
  licence: CC0 for every item below - no attribution required, commercial use permitted
  hdri:
    source: Poly Haven
    files:
      - kloofendal_48d_partly_cloudy_puresky_4k.hdr   # daylight
      - qwantani_dusk_1_puresky_4k.hdr                # dusk option
      - qwantani_dusk_2_puresky_4k.hdr                # dusk, in use
    sun_location_method: >-
      Poly Haven's `coords` field is the capture lat/long, NOT the sun position.
      The sun is found by scanning a downscaled copy of the HDRI for its brightest
      pixel and converting u,v to a direction. For the daylight sky this returned
      48.2 deg elevation, matching the "48d" in the asset name.
  textures:
    source: ambientCG (2K JPG sets)
    scale_note: >-
      Tiling scale is taken from ambientCG's published dimensionX/dimensionY, so
      textures are physically sized rather than eyeballed.
    mapping:
      Bricks051:        {material: MAT_EXT_BRICK_RED_XZ / _YZ, tile_m: 1.25}
      Bricks097:        {material: MAT_EXT_BRICK_DARK_BASE_XZ / _YZ, tile_m: 1.50,
                         note: darkened via Hue/Sat value 0.42}
      RoofingTiles013A: {material: MAT_ROOF_TILE_CHARCOAL, tile_m: 2.90, projection: UV}
      PavingStones128:  {material: MAT_SITE_PAVING, tile_m: 1.80}
      Grass005:         {material: MAT_SITE_LAWN, tile_m: 1.10}

