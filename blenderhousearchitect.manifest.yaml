  toggle_text_block: WALKTHROUGH_FAST_MODE.py
  status: performance_optimized_without_render_quality_loss

exterior_finishes:
  reference_image: Image/main.jpg
  brickwork:
    collection: ARCH_Exterior_Brickwork
    delivery: separate_exterior_veneer_objects
    bond: running_bond
    nominal_brick_size_m: [0.230, 0.110, 0.076]
    nominal_mortar_joint_m: 0.010
    main_finish:
      material_xz: MAT_EXT_BRICK_RED_XZ
      material_yz: MAT_EXT_BRICK_RED_YZ
      colour_family: consistent_mid_red_terracotta
      mortar_colour: light_grey_beige
      tone_correction:
        date: 2026-08-08
        reason: >-
          User: the first-level bricks in Image/main.jpg are one samish red tone,
          not a mix. The Brick Texture was picking 50/50 between an almost-black
          Color1 (sRGB 61,32,23) and a mid red-brown Color2 (sRGB 137,74,43),
          which read as a heavy patchwork at every distance.
        color1_srgb: [150, 90, 68]
        color2_srgb: [174, 110, 84]
        mortar_srgb: [178, 172, 158]
        soiling_multiplier_range: [0.84, 1.07]   # was 0.62-1.20
        roughness_range: [0.58, 0.72]
        note: >-
          Per-brick variation retained but narrowed to two close shades of the same
          red. Brick module and 10 mm joint unchanged.
        hue_status: >-
          Hue judged against a dusk photograph, so it is approximate. Reference
          patch sampled at sRGB ~167,122,92 which is warmer and more desaturated
          than typical daylight brick.
    lower_finish:
      material_xz: MAT_EXT_BRICK_DARK_BASE_XZ
      material_yz: MAT_EXT_BRICK_DARK_BASE_YZ
      colour_family: dark_brown
    veneer_thickness_m: 0.012
    shader_delivery: procedural_pbr_with_mortar_relief_colour_variation_and_micro_bump
    reference_status: confirmed_from_exterior_photo
    geometry_status: first_pass_exterior_only_non_conflicting_with_interior_work

interior_finishes:
  wall_lining:
    material: MAT_INT_PLASTER
    construction_assumption: set_and_painted_plasterboard
    shader_delivery: >-
      procedural - off-white low-sheen paint over a two-stage bump (large sheet
      undulation plus fine roller stipple). Swap for scanned maps in the
      photoreal pass; the bump chain is the only thing to rewire.
    applied:
      internal_walls:
        objects: WALL_GROUND_INT_* and WALL_GROUND_FAMILY_DROP_*_INFILL_*
        count: 25
        coverage: all_faces
      external_walls:
        objects: WALL_GROUND_EXT_*
        count: 20
        coverage: >-
          every inward-facing face including boolean opening reveals; the single
          outward skin face of each wall is left on MAT_WALL_EXTERNAL_BLOCKOUT
          because the brick veneer in ARCH_Exterior_Brickwork sits over it
        slot_convention:
          index_0: MAT_WALL_EXTERNAL_BLOCKOUT (outer skin, exterior pass owns it)
          index_1: MAT_INT_PLASTER (all interior-facing faces)
    exterior_face_classification:
      method: derived_from_object_name_orientation_token
      tokens: {_EXT_NORTH_: +Y, _EXT_SOUTH_: -Y, _EXT_EAST_: +X, _EXT_WEST_: -X}
      fallback: away_from_house_centroid_along_the_wall_thickness_axis
      manual_corrections:
        - object: WALL_GROUND_EXT_STEP_BED4_009
          corrected_exterior_normal: [0, 1, 0]
          reason: >-
            Re-entrant footprint step - bedroom 4 projects further east than the
            entry, so the outside is on the NORTH face. The centroid fallback
            picked south. Corrected manually.
      verification: >-
        All 20 external walls cross-checked against the independently authored
        BRICK_VENEER_* objects in ARCH_Exterior_Brickwork; every exterior normal
        matches the veneer placement.
    fixed_defects:
      - >-
        Boolean opening reveals on WALL_GROUND_EXT_NORTH_FAMILY_003 (7 faces) and
        WALL_GROUND_EXT_WEST_LAUNDRY_018 (4 faces) were on
        MAT_BOOLEAN_CUTTER_TRANSPARENT and rendered invisible. Now plastered.
    not_yet_finished:
      - ceilings_use_MAT_INT_CEILING_PAINT_placeholder
      - no_skirting_or_architraves_except_the_kitchen_render_set
      - wet_area_wall_tiling_not_modelled
    status: applied_and_verified
  floor_finishes:
    family_room_carpet:
      material: MAT_INT_CARPET
      description: light oatmeal cut pile, worn, per Image/kitchen.jpg
      shader_delivery: >-
        procedural - broad soiling blotches over a fine pile bump, with Principled
        sheen for the fabric falloff. No displacement or hair; adequate at room
        distance, will need real maps for close-ups.
      applied_to:
        - FLOOR_GROUND_FAMILY_DROPPED_001
        - STEP_FAMILY_LONG_01
        - STEP_FAMILY_LONG_02
        - STEP_FAMILY_HALL_01
        - STEP_FAMILY_HALL_02
      method: >-
        added as an extra material slot and assigned to every face except the
        downward-facing one; the original MAT_FAMILY_DROPPED_FLOOR /
        MAT_FAMILY_STEPS remain in slot 0 and are recoverable
      steps_carpeted: true
      steps_carpeted_note: >-
        Treads and risers carpeted to match the room. The photo shows a light
        band at the level change consistent with carpeted treads, but the
        junction detail is not clearly resolvable at that distance.
      confidence: colour_and_type_from_photo_provisional
  ceiling_fans:
    count: 2
    room: family
    objects: [SET_FAN_FAMILY_001, SET_FAN_FAMILY_002]
    collection: RENDER_Kitchen_Photoreal
    type: four_blade_metal_blade_fan_on_short_downrod
    blade_span_m: 1.22
    ceiling_fixing_z_m: 2.400
    blade_plane_z_m: 2.058
    blade_pitch_deg: 12
    positions_m: [[1.78, 5.95], [4.22, 5.95]]
    position_status: >-
