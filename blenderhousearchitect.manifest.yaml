      Sky held well below the interior lamps so the house carries the exposure -
      which is how a real blue-hour photograph is metered.
  lights_not_camera_visible: true
  eevee_caveat: >-
    EEVEE does not carry the interior lamps through the transmissive glazing, so it
    showed flat white windows and was misleading for this scene. All dusk balance
    decisions were made on low-resolution Cycles tests instead.
  status: first_pass_positions_assumed_not_surveyed

