        narrowed rather than moved - the host wall is only 1.195 m long, so the
        original 0.906 m opening could not clear both corners. Piers now 0.35 m.
  rebuild_method: >-
    Openings are baked into the wall meshes, so each affected wall was restored from
    its BASE_ recovery copy in ARCH_Wall_Bases, then every cutter with a matching
    host_wall custom property was re-applied. 10 external walls rebuilt.
  veneer_rebuild: >-
    Brick veneer is now generated from the cut wall's exterior faces (material index
    0), offset 0.5 mm and extruded 12 mm outward. This guarantees the veneer
