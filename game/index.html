<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balmoral — Walkthrough</title>
<style>
  :root {
    --ink: #d2d6dd;
    --dim: #79808d;
    --warm: #c99b6d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #10131a; color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    cursor: default;
  }
  canvas { display: block; }

  /* ---------- overlays ---------- */
  .layer {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    z-index: 10;
    transition: opacity .6s ease;
  }
  .hidden { opacity: 0; pointer-events: none; }

  #loading { background: #10131a; gap: 1.5rem; }
  #loading .bar {
    width: min(320px, 60vw); height: 2px; background: #232833; position: relative;
    border-radius: 2px; overflow: hidden;
  }
  #loading .bar i {
    position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--warm);
    transition: width .25s ease;
  }
  #loading .msg { font-size: .72rem; letter-spacing: .22em; color: var(--dim); text-transform: uppercase; }

  #title { background: radial-gradient(ellipse at center, #171b24 0%, #0c0e13 70%); gap: 1.4rem; }
  #title h1 {
    margin: 0; font-size: clamp(2.2rem, 8vw, 4.5rem); font-weight: 300;
    letter-spacing: .28em; text-indent: .28em; color: #eae6df;
  }
  #title .sub { font-size: .78rem; letter-spacing: .24em; color: var(--dim); text-transform: uppercase; }
  #title .keys {
    font-size: .74rem; line-height: 2.1; color: #737a88; letter-spacing: .06em;
    text-align: center; margin-top: .4rem;
  }
  #title .keys b { color: #aab1bf; font-weight: 500; }
  .enter {
    margin-top: .6rem; padding: .85rem 2.4rem; border: 1px solid #333a47;
    font-size: .74rem; letter-spacing: .2em; text-transform: uppercase;
    color: var(--warm); cursor: pointer; background: transparent;
    font-family: inherit; border-radius: 3px; transition: all .25s ease;
  }
  .enter:hover { background: rgba(201,155,109,.08); border-color: #5a4a38; }

  /* ---------- hud ---------- */
  #hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; }

  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 3px; height: 3px;
    margin: -1.5px 0 0 -1.5px; border-radius: 50%;
    background: rgba(210,214,221,.3);
  }

  #room {
    position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%);
    font-size: .74rem; letter-spacing: .3em; text-transform: uppercase;
    color: rgba(210,214,221,.55); opacity: 0; transition: opacity .9s ease;
    white-space: nowrap; text-shadow: 0 1px 12px rgba(0,0,0,.8);
  }
  #room.show { opacity: 1; }

  #notice {
    position: absolute; left: 50%; bottom: 15%; transform: translateX(-50%);
    font-size: .7rem; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(201,155,109,.9); opacity: 0; transition: opacity .25s ease;
    white-space: nowrap; text-shadow: 0 1px 12px rgba(0,0,0,.8);
  }
  #notice.show { opacity: 1; }

  #presence {
    position: absolute; right: 1.5rem; bottom: 1.3rem;
    font-size: .64rem; letter-spacing: .16em; text-transform: uppercase;
    color: rgba(140,147,160,.6);
  }

  /* ---------- who you are ---------- */
  .who { display: flex; flex-direction: column; align-items: center; gap: .9rem; margin-top: .4rem; }
  #nameInput {
    background: rgba(255,255,255,.04); border: 1px solid #333a47; border-radius: 3px;
    color: var(--ink); font-family: inherit; font-size: .82rem; letter-spacing: .08em;
    padding: .6rem 1rem; text-align: center; width: 15rem; outline: none;
  }
  #nameInput:focus { border-color: #5a4a38; }
  #nameInput::placeholder { color: #5c6373; }
  .swatches { display: flex; gap: .55rem; }
  .swatch {
    width: 1.55rem; height: 1.55rem; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; padding: 0; transition: all .18s ease;
    opacity: .55;
  }
  .swatch:hover { opacity: .85; transform: scale(1.08); }
  .swatch.on { opacity: 1; border-color: #e7e3db; transform: scale(1.12); }
  .share { font-size: .64rem; letter-spacing: .12em; color: #5c6373; margin-top: .2rem; }

  #meta {
    position: absolute; left: 1.5rem; top: 1.3rem;
    font-size: .66rem; letter-spacing: .16em; color: rgba(140,147,160,.6);
    line-height: 1.9; text-transform: uppercase;
  }
  #meta .n { color: rgba(201,155,109,.85); }

  #stats {
    position: absolute; right: 1.5rem; top: 1.3rem;
    font-size: .62rem; letter-spacing: .1em; color: rgba(110,116,128,.55);
    text-align: right; line-height: 1.8;
  }

  #pause { background: rgba(12,14,19,.88); gap: 1rem; }
  #pause h2 { margin: 0; font-size: 1rem; letter-spacing: .3em; font-weight: 400; color: #aab1bf; }
  #pause .hint { font-size: .7rem; letter-spacing: .18em; color: #5c6373; }
</style>
</head>
<body>

<div id="hud">
  <div id="crosshair"></div>
  <div id="meta"></div>
  <div id="stats"></div>
  <div id="room"></div>
  <div id="notice"></div>
  <div id="presence"></div>
</div>

<div class="layer" id="loading">
  <div class="msg" id="loadMsg">opening the house</div>
  <div class="bar"><i id="loadBar"></i></div>
</div>

<div class="layer hidden" id="title">
  <h1>BALMORAL</h1>
  <div class="sub">first-person walkthrough</div>
  <div class="keys">
    <b>W A S D</b> move &nbsp;·&nbsp; <b>MOUSE</b> look &nbsp;·&nbsp; <b>SHIFT</b> run<br>
    <b>C</b> crouch &nbsp;·&nbsp; <b>[ ]</b> look speed &nbsp;·&nbsp; <b>ESC</b> release the pointer
  </div>

  <div class="who">
    <input id="nameInput" maxlength="18" placeholder="your name" autocomplete="off" spellcheck="false">
    <div id="swatches" class="swatches"></div>
  </div>

  <button class="enter" id="enterBtn">walk through</button>
  <div class="share">share the link and up to 6 of you can walk it together</div>
</div>

<div class="layer hidden" id="pause">
  <h2>PAUSED</h2>
  <div class="hint">click to continue</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/",
    "three-mesh-bvh": "./vendor/three-mesh-bvh.module.js"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
