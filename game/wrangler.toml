name = "balmoral-room"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed Durable Objects are the ones available on the Workers free
# plan. Classic (key-value) DOs require a paid plan, so this must stay
# new_sqlite_classes even though the room keeps no persistent state.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
